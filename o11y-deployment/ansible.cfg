[defaults]
inventory = inventory/hosts
# needed for a solution like vault or openbao
remote_user = ansible
# Key lives outside the repo; ssh auto-loads ~/.ssh/o11y-cert.pub next to it
private_key_file = ~/.ssh/o11y
# Prevents annoying SSH prompts that break automation
host_key_checking = False
allow_world_readable_tmpfiles = true
# With the first two lines, it works great but with the two under add more smooth automation,
# clearer feedbacks and reliable connections

[ssh_connection]
# Prevents connection failures on slow networks
timeout = 30

[privilege_escalation]
become = True
become_method = sudo
become_ask_pass = False
