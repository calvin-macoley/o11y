---

project_name: "o11y"

o11y__user:
  name: "o11y"
  uid: "151"
  append: true
  shell: "/bin/bash"
  home: "/home/o11y"
  mode_dir: "0755"
  
grafana__config:
  name: "grafana"
  tag: "nightly"
  image_url: "docker.io/grafana/grafana-enterprise:nightly"
  container_port: "3000"
  compose_folder: "{{ o11y__user.home }}/compose_files"
  data_folder: "{{ o11y__user.home }}/data/grafana"
  volume_path: "/var/lib/grafana"

mimir__config:
  name: "mimir"
  tag: "3.1.3"
  image_url: "docker.io/grafana/mimir:3.1.3"
  compose_folder: "{{ o11y__user.home }}/compose_files"
  data_folder: "{{ o11y__user.home }}/data/mimir"
  volume_path: "/data"

minio__config:
  name: "minio"
  tag: "RELEASE.2025-09-07T16-13-09Z-cpuv1"
  image_url: "docker.io/minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1"
  data_folder: "{{ o11y__user.home }}/data/minio"
  volume_path: "/data"

nginx__config:
  name: "load-balancer"
  tag: "stable-trixie"
  image_url: "docker.io/library/nginx:stable-trixie"
  container_port: "9009"
  data_folder: "{{ o11y__user.home }}/data/nginx"
  volume_path: "/etc/nginx"

tempo__config:
  name: "tempo"
  # pinned below GOAMD64=v2 (grafana/tempo Makefile, PR #4755, 2025-02-27):
  # this host's CPU (QEMU "Virtual CPU version 2.5+") lacks the SSE4.2/POPCNT
  # baseline that tempo/tempo-vulture >=2.8 require and crash on at startup.
  tag: "2.7.2"
  image_url: "docker.io/grafana/tempo:2.7.2"
  compose_folder: "{{ o11y__user.home }}/compose_files"
  data_folder: "{{ o11y__user.home }}/data/tempo"
  volume_path: "/var/tempo"
  container_port: "3200"
  otlp_grpc_port: "4317"
  otlp_http_port: "4318"

loki__config:
  name: "loki"
  tag: "3.3.2"
  image_url: "docker.io/grafana/loki:3.3.2"
  compose_folder: "{{ o11y__user.home }}/compose_files"
  data_folder: "{{ o11y__user.home }}/data/loki"
  gateway_port: "3100"
  read_port: "3101"
  write_port: "3102"
