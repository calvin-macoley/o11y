---

- import_playbook: ssh-cert.yml

- name:  The release commons are installed
  hosts: all
  become: true
  tasks:
    - name:  Common role tasks are being played
      ansible.builtin.include_role:
        name:  o11y_commons
      vars:
        o11y_commons__actions: "{{ item }}"
      loop:
        - utilities
        - users
        - directories

    - name:  Hosts trust the OpenBao SSH CA
      ansible.builtin.include_role:
        name:  calvin.openbao.ssh_ca_trust
